<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paiement</title>

<style>
/* MLO – Interface paiement premium */

body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f4f5f7;
  padding: 20px;
}

.container {
  max-width: 420px;
  margin: auto;
}

h1 {
  text-align: center;
  margin-bottom: 25px;
}

input {
  width: calc(100% - 2px);
  box-sizing: border-box;
  padding: 18px;
  font-size: 18px;
  border-radius: 12px;
  border: 1px solid #ddd;
  margin-bottom: 20px;
}

/* ROW */
.row {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
}

/* BASE BUTTON */
button {
  flex: 1;
  padding: 16px;
  font-size: 16px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  transition: all 0.2s ease;
}

/* ===== LIGNE 1 : MODE ===== */

/* Paiement (marine) */
.btn-payment {
  background: #0f2a44;
  color: white;
}

/* Caution (or) */
.btn-preauth {
  background: #c8a96a;
  color: #1a1a1a;
}

/* ===== LIGNE 2 : ACTION ===== */

/* Envoyer (vert premium) */
.btn-send {
  background: #2e7d5b;
  color: white;
}

/* Annuler (rouge premium) */
.btn-cancel {
  background: #8b2e2e;
  color: white;
}

/* HOVER subtil */
button:hover {
  transform: translateY(-1px);
  opacity: 0.95;
}

/* STATUS */
#status {
  margin-top: 20px;
  text-align: center;
  font-size: 16px;
}
</style>
</head>

<body>

<div class="container">
  <h1>Paiement</h1>

  <input type="number" id="amount" placeholder="Montant (€)" />

  <div class="row">
    <button class="btn-payment" onclick="setMode('immediate')">Paiement</button>
    <button class="btn-preauth" onclick="setMode('preauth')">Caution</button>
  </div>

  <input 
  type="text" 
  id="customer-name" 
  placeholder="Nom du client"
  style="width:100%;padding:12px;margin:10px 0;font-size:16px;border-radius:8px;border:1px solid #ccc;background:#fff7e8;"
/>

<input 
  type="email" 
  id="customer-email" 
  placeholder="Email du client (reçu)"
  style="width:100%;padding:12px;margin:10px 0;font-size:16px;border-radius:8px;border:1px solid #ccc;background:#f4e1c1;"
/>

  <div class="row">
    <button class="btn-send" onclick="sendPayment()">Envoyer</button>
    <button class="btn-cancel" onclick="cancelPayment()">Annuler</button>
  </div>

  <div id="status"></div>
</div>

<script>
let selectedMode = 'immediate';
const readerId = "tmr_Gc499AZwV2dMwj";

function setMode(mode) {
  selectedMode = mode;
  document.getElementById('status').innerText =
    "Mode: " + (mode === 'immediate' ? 'Paiement' : 'Caution');
}

async function sendPayment() {

  const amountInput = document.getElementById('amount').value;
  const email = document.getElementById('customer-email').value.trim();
  const status = document.getElementById('status');

  if (!amountInput) {
    status.innerText = "Montant requis";
    return;
  }

  if (!email || !/^\S+@\S+\.\S+$/.test(email)) {
    alert('Email client invalide');
    return;
  }

  console.log('EMAIL ENVOYÉ :', email);

  const amount = Math.round(parseFloat(amountInput) * 100);

  try {
    status.innerText = "Création du paiement...";

    const piRes = await fetch('/create-payment-intent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        amount,
        currency: 'eur',
        mode: selectedMode,
        email
      })
    });

    const piData = await piRes.json();

    if (!piData.ok) throw new Error("Erreur création paiement");

    status.innerText = "Envoi au terminal...";

    const collectRes = await fetch('/collect-payment-method', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        reader_id: readerId,
        payment_intent_id: piData.payment_intent_id
      })
    });

    const collectData = await collectRes.json();

    if (!collectData.ok) throw new Error("Erreur terminal");

    status.innerText = "En attente carte sur terminal";

  } catch (err) {
    status.innerText = "Erreur : " + err.message;
  }
}

async function cancelPayment() {
  const status = document.getElementById('status');

  try {
    status.innerText = "Annulation en cours...";

    const res = await fetch('/cancel-reader-action', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ reader_id: readerId })
    });

    const data = await res.json();

    if (!data.ok) throw new Error("Erreur annulation");

    status.innerText = "Paiement annulé";

  } catch (err) {
    status.innerText = "Erreur : " + err.message;
  }
}
</script>

</body>
</html>
